[project]
name = "saul-earth"
dynamic = ["version"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "esi-core",  # https://code.usgs.gov/ghsc/esi/esi-core
    "ipython",
    "lxml",
    "matplotlib",
    "multitaper",  # https://github.com/gaprieto/multitaper
    "numpy",
    "obspy",
    "pandas",
    "requests",
    "scipy",
    "stockwell",  # https://github.com/claudiodsf/stockwell
]

[dependency-groups]
dev = ["ruff"]
docs = [
    "sphinx",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/saul"]

[tool.ruff.format]
quote-style = "single"
