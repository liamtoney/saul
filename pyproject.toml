[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "saul"
description = "SeismoAcoustic Utilities Library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Liam Toney", email = "liam@liam.earth" },
]
maintainers = [
    { name = "Liam Toney", email = "liam@liam.earth" },
]
keywords = ["seismology", "infrasound", "obspy"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "esi-core",  # https://code.usgs.gov/ghsc/esi/esi-core
    "ipython",
    "lxml",
    "matplotlib",
    "multitaper",  # https://github.com/gaprieto/multitaper
    "numpy",
    "obspy",
    "pandas",
    "requests",
    "scipy",
    "stockwell",  # https://github.com/claudiodsf/stockwell
]
[dependency-groups]
tooling = ["poethepoet"]
lint = ["ruff"]
docs = [
    "sphinx",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinx-copybutton"
]

[project.urls]
Documentation = "https://saul.liam.earth/"
Source = "https://github.com/liamtoney/saul"
Issues = "https://github.com/liamtoney/saul/issues"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/saul"]

[tool.poe.env]
TARGET_FILES = "src/ examples/ docs/"

[tool.poe.tasks]
docs = "sphinx-build docs/ docs/_build/ --fail-on-warning"
_lint = "ruff check ${TARGET_FILES}"
_format = "ruff format ${TARGET_FILES}"
format = ["_lint --select I --fix", "_format"]
check = ["_lint", "_format --check"]

[tool.ruff.format]
quote-style = "single"
